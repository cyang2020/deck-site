name: Xiaoyuan
options:
  bundleIdPrefix: com.siyao
  deploymentTarget:
    iOS: "17.0"
targets:
  Xiaoyuan:
    type: application
    platform: iOS
    sources: [Sources]
    resources:
      - path: ../garden/assets
        includes: ["*.png"]
        excludes: ["*.orig.png", "style-key.png"]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 小园
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: 选一张照片,晾进花房
        NSCameraUsageDescription: 拍一张,晾进花房
        NSMicrophoneUsageDescription: 把烦恼说给娃娃听(只存在这台手机上)
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
